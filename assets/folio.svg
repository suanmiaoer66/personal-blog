    <text x="150" y="365" font-family="Arial, sans-serif" font-size="7.5" letter-spacing="1.1" fill="#A19B8E">COLLECTIONS</text>
    <rect x="141" y="378" width="121" height="27" rx="5" fill="#EAE6D8"/>
    <circle cx="155" cy="391" r="3" fill="#B89673"/>
    <text x="166" y="395" font-family="Arial, sans-serif" font-size="9" fill="#776449">Everyday thoughts</text>
    <circle cx="155" cy="422" r="3" fill="#9DAA8F"/><text x="166" y="426" font-family="Arial, sans-serif" font-size="9" fill="#8D8779">Things I’m learning</text>
    <circle cx="155" cy="453" r="3" fill="#BB9F9B"/><text x="166" y="457" font-family="Arial, sans-serif" font-size="9" fill="#8D8779">Somewhere, someday</text>
    <circle cx="155" cy="501" r="9" fill="#DEDBCB"/><text x="153" y="504" font-family="Arial, sans-serif" font-size="8" fill="#776449">L</text>
    <text x="171" y="504" font-family="Arial, sans-serif" font-size="8" fill="#817969">Lin’s workspace</text>
    <text x="299" y="189" font-family="Arial, sans-serif" font-size="8" fill="#9B9487">Everyday thoughts <tspan dx="8">/</tspan><tspan dx="8" fill="#756E62">On a quieter morning</tspan></text>
    <text x="707" y="189" font-family="Arial, sans-serif" font-size="8" fill="#999082">•••</text>
    <path d="M289 207H757" stroke="#F0EDE5"/>
    <text x="325" y="255" font-family="Arial, sans-serif" font-size="9" letter-spacing="1.2" fill="#B3987B">PERSONAL NOTES / 023</text>
    <text x="325" y="296" font-family="Georgia, serif" font-size="30" fill="#655544" letter-spacing="-1">On a quieter morning</text>
    <text x="325" y="321" font-family="Arial, sans-serif" font-size="8" fill="#ADA393">SEPTEMBER 21, 2026 <tspan dx="8">·</tspan><tspan dx="8">3 MIN READ</tspan></text>
    <text x="325" y="361" font-family="Georgia, serif" font-size="12" fill="#807562">Maybe a good day begins with a little less.</text>
    <text x="325" y="385" font-family="Arial, sans-serif" font-size="9" fill="#9C9180">Less scrolling, more looking out of the window. Less hurry,</text>
    <text x="325" y="402" font-family="Arial, sans-serif" font-size="9" fill="#9C9180">more coffee while it’s still warm. A small space to notice things.</text>
    <rect x="325" y="425" width="2" height="47" fill="#C9AE90"/>
    <text x="341" y="444" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#9C8063">“There is a whole world in</text>
    <text x="341" y="464" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#9C8063">the things we almost miss.”</text>
    <text x="326" y="501" font-family="Arial, sans-serif" font-size="8" fill="#BBB2A5">Saved, just now.</text>
  </g>
  <g transform="rotate(8 708 459)" filter="url(#cardshadow)">
