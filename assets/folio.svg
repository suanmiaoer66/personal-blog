    <g fill="#807B6C" font-family="Arial, sans-serif" font-size="9"><text x="173" y="263">All notes</text><text x="173" y="290">Recently opened</text><text x="173" y="317">Little favourites</text></g>
    <g stroke="#9E9685" stroke-width="1.2"><rect x="151" y="255" width="10" height="10" rx="2"/><path d="M154 258H159M154 261H159"/><circle cx="156" cy="287" r="5"/><path d="M156 283V287L159 289M150 315L155 319L162 310"/></g>
