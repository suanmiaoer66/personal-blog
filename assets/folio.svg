    <rect x="128" y="133" width="648" height="397" rx="12" fill="#FFFDF7"/>
    <path d="M140 133H764A12 12 0 0 1 776 145V164H128V145A12 12 0 0 1 140 133Z" fill="#F0EDE4"/>
