    <rect x="665" y="339" width="95" height="20" fill="#E9D8BB" fill-opacity=".65" transform="rotate(-3 712 349)"/>
    <text x="636" y="386" font-family="Arial, sans-serif" font-size="8" letter-spacing="1.4" fill="#AA9877">NOTE TO SELF</text>
    <text x="636" y="421" font-family="Georgia, serif" font-size="21" fill="#826648">Make room</text>
    <text x="636" y="447" font-family="Georgia, serif" font-size="21" fill="#826648">for the</text>
    <text x="636" y="473" font-family="Georgia, serif" font-size="21" font-style="italic" fill="#826648">unfinished.</text>
    <path d="M637 488C670 481 723 487 744 483" stroke="#B69263" stroke-width="1.1"/>
    <text x="637" y="526" font-family="Arial, sans-serif" font-size="8" fill="#B7A486">Ideas are allowed to take their time.</text>
